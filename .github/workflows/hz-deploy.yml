# Builds the image and deploys it; configuration lives in the repository settings.
name: Deploy ui (new server)

on:
  workflow_dispatch: {}

jobs:
  build_and_deploy:
    if: github.actor == 'maslianok'
    environment: production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/gitranks/gitranks-ui
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          build-args: |
            NEXT_PUBLIC_URI=${{ vars.NEXT_PUBLIC_URI }}
            URI_GITRANKS=${{ secrets.URI_GITRANKS_BUILD }}
          secrets: |
            internal_jwt_secret=${{ secrets.INTERNAL_JWT_SECRET }}
            cf_build_bypass_token=${{ secrets.CF_BUILD_BYPASS_TOKEN }}

      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        env:
          DEPLOY_KEY: ${{ secrets.HZ_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.HZ_KNOWN_HOSTS }}
          HOST: ${{ vars.HZ_HOST_A }}
        run: |
          [ -n "$HOST" ] || { echo "vars.HZ_HOST_A is not set"; exit 1; }
          install -d -m 0700 ~/.ssh
          (umask 077; printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host octo\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/deploy_key\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config

      - name: Send the environment file
        env:
          INTERNAL_JWT_SECRET: ${{ secrets.INTERNAL_JWT_SECRET }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          AUTH_GITHUB_SECRET: ${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GITHUB_ID: ${{ vars.AUTH_GITHUB_ID }}
          AUTH_GITHUB_BASIC_SECRET: ${{ secrets.AUTH_GITHUB_BASIC_SECRET }}
          AUTH_GITHUB_BASIC_ID: ${{ vars.AUTH_GITHUB_BASIC_ID }}
          AUTH_URL: ${{ vars.AUTH_URL }}
          NEXT_PUBLIC_URI: ${{ vars.NEXT_PUBLIC_URI }}
          # Contribute's pull request access: optional, so a deploy works before they exist (the link then stays off).
          AUTH_GITHUB_CONTRIBUTE_ID: ${{ vars.AUTH_GITHUB_CONTRIBUTE_ID }}
          AUTH_GITHUB_CONTRIBUTE_SECRET: ${{ secrets.AUTH_GITHUB_CONTRIBUTE_SECRET }}
          CONTRIBUTE_GRANT_SEAL_KEYS: ${{ secrets.CONTRIBUTE_GRANT_SEAL_KEYS }}
        run: |
          set -euo pipefail
          names="INTERNAL_JWT_SECRET AUTH_SECRET AUTH_GITHUB_SECRET AUTH_GITHUB_ID AUTH_GITHUB_BASIC_SECRET AUTH_GITHUB_BASIC_ID AUTH_URL NEXT_PUBLIC_URI"
          optional="AUTH_GITHUB_CONTRIBUTE_ID AUTH_GITHUB_CONTRIBUTE_SECRET CONTRIBUTE_GRANT_SEAL_KEYS"
          for n in $names; do
            [ -n "${!n}" ] || { echo "$n is not set"; exit 1; }
          done
          {
            for n in $names; do
              printf '%s=%s\n' "$n" "${!n}"
            done
            for n in $optional; do
              [ -z "${!n}" ] || printf '%s=%s\n' "$n" "${!n}"
            done
          } |
            ssh octo put-env ui-gitranks

      - name: Let the server pull the image
        env:
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
        run: printf '%s' "$GHCR_PAT" | ssh octo docker-login

      - name: Deploy
        run: ssh octo "deploy ui-gitranks ${{ github.sha }}"
