# Everything an organization's v3 badges read, in one query.
query BadgeOrg($login: String!) {
  organization(login: $login) {
    login
    avatarUrl
    s
    reposCount
    reposOver1k
    rankOrg {
      s
      sM
    }
    topRepos(first: 3) {
      nameWithOwner
      stars
      rank {
        s
      }
    }
    pulse {
      lastMonth
      last12 {
        activeContributors
        newContributors
      }
      countryCount
      contributors60
    }
    wallPopular: contributorsWall(order: POPULAR) {
      ...BadgeWall
    }
    wallContributions: contributorsWall(order: CONTRIBUTIONS) {
      ...BadgeWall
    }
    wallNewest: contributorsWall(order: NEWEST) {
      ...BadgeWall
    }
    pulseSeries {
      months
      activeLinked
      activeAnonymous
      newContributors
    }
  }
  orgRankTotal
}
