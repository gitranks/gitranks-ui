# Everything a repository's v3 badges read, in one query.
# The API refuses queries above complexity 220; this one costs about 195, so
# check the budget before adding another costly field (pulse-sized, ~25).
query BadgeRepo($owner: String!, $name: String!) {
  repo(owner: $owner, name: $name) {
    nameWithOwner
    language
    stars
    gainedThisMonth
    monthStarts
    history {
      points {
        date
        stars
      }
      current {
        date
        stars
      }
      complete
    }
    rank {
      s
      sM
      l
      lM
      language
      tier {
        tier
        level
      }
    }
    rankGoal {
      ...BadgeRankGoal
    }
    wallPopular: contributorsWall(order: POPULAR) {
      ...BadgeWall
    }
    wallContributions: contributorsWall(order: CONTRIBUTIONS) {
      ...BadgeWall
    }
    wallNewest: contributorsWall(order: NEWEST) {
      ...BadgeWall
    }
    starsBest {
      total
      counts {
        tier
        count
      }
      top {
        login
        avatarUrl
        tier
        level
      }
    }
    siblings {
      share
      repo {
        nameWithOwner
      }
    }
    builtBy {
      counts {
        tier
        count
      }
    }
    pulse {
      lastMonth
      last12 {
        activeContributors
        newContributors
      }
      countryCount
      contributors60
    }
    pulseSeries {
      months
      activeLinked
      activeAnonymous
      newContributors
    }
  }
  repoRankTiers {
    repos
    tiers {
      tier
      level
    }
  }
  repoLanguages {
    language
    repos
  }
}
