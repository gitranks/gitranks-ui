query OrgPulseContributors(
  $login: String!
  $period: OrgPulsePeriod!
  $sortBy: OrgPulseContributorSort!
  $label: String
  $first: Int!
  $offset: Int!
) {
  organization(login: $login) {
    pulseContributors(period: $period, sortBy: $sortBy, label: $label, first: $first, offset: $offset) {
      ...PulseContributorPageFields
    }
  }
}
