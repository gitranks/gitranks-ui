query PackageRankings($registry: PackageRegistry!, $by: PackageRankingType!, $offset: Int) {
  packageRankings(registry: $registry, by: $by, offset: $offset) {
    rank
    previousRank
    value
    change
    name
    displayName
    description
    repositoryName
    ownerAvatarUrl
    repo {
      nameWithOwner
    }
  }
}

query PackageRankingFacts($registry: PackageRegistry!) {
  packageRankingFacts(registry: $registry) {
    ranked
    dependentsReadAt
    downloadsThrough
    ranksAt
  }
}
