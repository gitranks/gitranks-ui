query PageOrg($login: String!) {
  organization(login: $login) {
    login
    name
    rankOrg {
      s
      sM
    }
    githubId
    avatarUrl
    email
    location
    countryFlag
    twitterUsername
    websiteUrl
    isVerified
    githubCreatedAt
    githubUpdatedAt
    s
    reposCount
    usersCount
    updatedAt
    hasActivity
    pulse {
      lastMonth
      snapshot {
        label
        lines
        share
      }
      last12 {
        added
        deleted
        net
        commits
        pullRequests
        activeContributors
        newContributors
      }
      topContributors {
        githubId
        login
        hasProfile
        avatarUrl
        linesAdded
        linesDeleted
        commits
        pullRequests
        activeMonths
        topLabels
      }
      unlinkedAuthors12
      countries {
        group
        country
        flag
        contributors
      }
      sharedContributorOrgs {
        login
        sharedContributors
        share
        organization {
          login
          name
          avatarUrl
        }
      }
      scopeNote
      computedAt
    }
  }
}
