query PageOrg($login: String!) {
  organization(login: $login) {
    login
    name
    rankOrg {
      s
      sM
    }
    githubId
    avatarUrl
    email
    location
    countryFlag
    twitterUsername
    websiteUrl
    isVerified
    githubCreatedAt
    githubUpdatedAt
    s
    reposCount
    usersCount
    updatedAt
    hasActivity
    topRepos {
      ...RepoRowFields
      rank {
        s
      }
    }
    pulse {
      lastMonth
      snapshot {
        ...PulseLabelLinesFields
      }
      last12 {
        ...PulseTotalsFields
      }
      topContributors {
        ...PulseContributorFields
      }
      unlinkedAuthors12
      countries {
        ...PulseCountryFields
      }
      sharedContributorOrgs {
        login
        sharedContributors
        share
        organization {
          login
          name
          avatarUrl
        }
      }
      scopeNote
      computedAt
    }
  }
}
