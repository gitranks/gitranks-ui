query PageProfileOverview($login: String!, $isGlobalContext: Boolean! = true) {
  user(login: $login) {
    firstSeenAt
    ...UserBaseFields
    ...UserFetchingStatus
    ...UserSeo
    starsNotCounted {
      stars
      repositories
    }
    ...UserTiersGlobal @include(if: $isGlobalContext)
    ...UserTiersCountry @skip(if: $isGlobalContext)
    # Both unconditional: the summary names the worldwide and the country rank on either tab, and the
    # badges section needs the global ranks on the country tab too.
    rankGlobal {
      s
      sProvisional
      sM
      c
      cProvisional
      cM
      f
      fProvisional
      fM
      snapshots
    }
    rankCountry {
      s
      sProvisional
      sM
      c
      cProvisional
      cM
      f
      fProvisional
      fM
      snapshots
    }
    sLangs(limit: 4) {
      name
      color
      size
      score
      sources {
        name
        stargazerCount
        percentage
        year
      }
    }
    cLangs(limit: 4) {
      name
      color
      size
      sources {
        name
        stargazerCount
        percentage
        year
        linesAdded
        linesRemoved
        prsCount
        url
      }
    }
    snapshots
    starsReview {
      status
      stars
      repositories
      reportable
    }
    repositories(limit: 5) {
      ...RepositoryFields
    }
    contributions(limit: 5) {
      ...ContributionFields
    }
    timeline(limit: 5) {
      changes
      createdAt
    }
  }
}
