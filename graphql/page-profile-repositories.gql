query PageProfileRepositories($login: String!) {
  user(login: $login) {
    ...UserBaseFields
    ...UserFetchingStatus
    ...UserDailyUpdates
    ...UserSeo
    repositoriesCount
    repositories(limit: 10) {
      ...RepositoryFields
    }
    contributions(limit: 10) {
      ...ContributionFields
    }
  }
}
