query PageRepo($owner: String!, $name: String!) {
  repo(owner: $owner, name: $name) {
    ...RepoRowFields
    isArchived
    createdAt
    renamedTo
    rank {
      language
      s
      sM
      l
      lM
    }
    burstMonths
    history {
      points {
        date
        stars
      }
      current {
        date
        stars
      }
      complete
      readAt
    }
    pull {
      status
      requestedAt
      finishedAt
    }
  }
}
