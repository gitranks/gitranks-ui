query PageRepo($owner: String!, $name: String!) {
  repo(owner: $owner, name: $name) {
    ...RepoRowFields
    isArchived
    isInOrganization
    createdAt
    renamedTo
    rank {
      language
      s
      sM
      l
      lM
      tier {
        tier
        level
        minRank
        maxRank
        minValue
      }
      languageTier {
        tier
        level
      }
    }
    burstMonths
    history {
      points {
        date
        stars
      }
      current {
        date
        stars
      }
      complete
      readAt
    }
    pull {
      status
      requestedAt
      finishedAt
    }
    siblings {
      shared
      share
      repo {
        ...RepoRowFields
      }
    }
    builtBy {
      accounts
      counts {
        tier
        count
      }
      top {
        login
        avatarUrl
        tier
        level
      }
    }
  }
}
