query ProfileIdByLogin($login: String!) {
  globalRankByLogin(login: $login) {
    githubId
    s
    sProvisional
    c
    cProvisional
    f
    fProvisional
    user {
      login
      s
      c
      f
      country
    }
  }
  countryRankByLogin(login: $login) {
    s
    sProvisional
    c
    cProvisional
    f
    fProvisional
  }
}
