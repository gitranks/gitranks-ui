query RepoRankings($offset: Int, $language: String, $noLanguage: Boolean) {
  repoRankings(offset: $offset, language: $language, noLanguage: $noLanguage) {
    githubId
    s
    sM
    l
    lM
    tier {
      tier
      level
    }
    languageTier {
      tier
      level
    }
    repo {
      ...RepoRowFields
    }
  }
}
