type Repo {
  builtBy: RepoBuiltBy
  burstMonths: [String!]

  """
  Avatars of the repository's top contributors (the union of the top 100 of each period by lines, commits and pull requests), at most 70, built with its analytics. `NEWEST` ranks only those rows.
  """
  contributorsWall(order: ContributorsWallOrder! = POPULAR): ContributorsWall
  createdAt: DateTime
  description: String
  gainedThisMonth: Int
  githubId: String!
  history: RepoHistory
  isArchived: Boolean
  isInOrganization: Boolean
  language: String
  monthStarts: JSON
  name: String!
  nameWithOwner: String!
  owner: String!
  ownerAvatarUrl: String
  ownerId: String
  pull: RepoPull
  pulse: RepoPulseFacts

  """
  The repository's top contributors: the union of the top 100 of each period by lines, commits and pull requests. A label table, and which labels are listed, rank only that union, so a contributor outside it is missing even when among the top of a label.
  """
  pulseContributors(first: Int! = 25, label: String, offset: Int! = 0, period: OrgPulsePeriod! = LAST_12_MONTHS, sortBy: OrgPulseContributorSort! = LINES): OrgPulseContributorPage
  pulseSeries(groupBy: OrgActivityGroupBy! = TYPE): OrgPulseSeries
  pushedAt: DateTime
  rank: RankRepo
  rankGoal: RankGoal
  renamedTo: String
  siblings: [RepoSibling!]
  stars: Int!
  starsAt: DateTime
  starsBest: RepoStarsBest
}

