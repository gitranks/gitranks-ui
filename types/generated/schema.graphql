  repo(name: String!, owner: String!): Repo
  repoLanguages: [RepoLanguageSummary!]!
  repoRankTiers(language: String, noLanguage: Boolean): RepoRankTiers
  repoRankings(language: String, limit: Int! = 100, noLanguage: Boolean, offset: Int! = 0): [RankRepo!]!
  repoSitemapParts: Int!
