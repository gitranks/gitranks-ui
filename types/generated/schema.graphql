  countryCount: Int!
  last12: OrgPulseTotals!
  lastMonth: String!
  scopeNote: String!
  snapshot: [OrgPulseLabelLines!]!
  topContributors: [OrgPulseContributor!]!
  unlinkedAuthors12: Int!
}

